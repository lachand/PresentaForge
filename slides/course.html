<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self'; connect-src 'self' https:; base-uri 'self'; form-action 'self'; object-src 'none'">
    <title>presentaForge — Cours</title>

<body>
    <div id="course-status" class="course-status" role="status" aria-live="polite">

        <ul id="course-catalog-list" class="course-catalog-list"></ul>
    </main>
    <script src="../shared/slides/firebase-storage.js?v=9"></script>
