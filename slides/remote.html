<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Chantier 8 (sécurité) — CSP stricte (enforce). Un CSP `Report-Only` via <meta>
         est ignoré par les navigateurs : politique appliquée directement, après
         extraction des scripts inline (plus aucun bloc JS dans le HTML). Voir docs/developer/SECURITY_MODEL.md. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'">
    <title>presentaForge — Télécommande mobile</title>
    <link rel="icon" type="image/png" href="assets/brand/presentaforge_favico.png">
    <link rel="apple-touch-icon" href="assets/brand/presentaforge_favico.png">
    <link rel="stylesheet" href="../shared/slides/ui-primitives.css?v=4">
    <style>
        /* Télécommande = usage salle sombre : tokens Forge (thème sombre forcé) */
        :root {
            --bg:        var(--surface-dim);
            --surface:   var(--surface-container);
            --surface-2: var(--surface-container-high);
            --border:    var(--outline-variant);
            --text:      var(--on-surface);
            --muted:     var(--on-surface-muted);
            --warn:      var(--warning);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            background: radial-gradient(circle at top, var(--surface-container-high) 0%, var(--surface) 65%);
            color: var(--text);
            font-family: var(--font-ui);
            padding: 14px;
        }
        .remote-wrap {
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .remote-card {
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--surface) 90%, transparent);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        .remote-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .remote-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-bottom: 8px;
        }
        .remote-row-goto {
            margin-top: 8px;
            margin-bottom: 0;
        }
        .remote-field {
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            padding: 9px 10px;
            font-size: 0.9rem;
            outline: none;
        }
        .remote-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--focus-ring-color);
        }
        .remote-btn {
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            padding: 9px 12px;
            font-size: 0.86rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
        }
        .remote-btn:hover { border-color: var(--primary); color: var(--primary); }
        .remote-btn.primary {
            border-color: color-mix(in srgb, var(--primary) 65%, var(--border));
            background: color-mix(in srgb, var(--primary) 16%, transparent);
            color: var(--primary);
        }
        .remote-btn:disabled {
            opacity: 0.45;
            cursor: default;
            color: var(--muted);
            border-color: var(--border);
        }
        .remote-status {
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--muted);
            min-height: 34px;
            margin: 2px 0 0;
        }
        .remote-status.ok { color: var(--success); }
        .remote-status.warn { color: var(--warn); }
        .remote-status.error { color: var(--danger); }
        .remote-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .remote-grid .remote-btn { width: 100%; }
        .remote-subline {
            font-size: 0.74rem;
            color: var(--muted);
            margin: 5px 0 0;
        }
        @media (max-width: 420px) {
            .remote-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="remote-wrap">
        <section class="remote-card" aria-labelledby="remote-conn-title">
            <h1 class="remote-title" id="remote-conn-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
                Télécommande présentateur
            </h1>
            <div class="remote-row">
                <label class="ui-sr-only" for="remote-room">ID de salle</label>
                <input id="remote-room" class="remote-field ui-input" maxlength="40" placeholder="ID de salle" autocomplete="off" aria-describedby="remote-status">
                <button id="remote-connect" class="remote-btn ui-btn primary ui-btn--primary">Connecter</button>
            </div>
            <div class="remote-row">
                <label class="ui-sr-only" for="remote-password">Mot de passe</label>
                <input id="remote-password" type="password" class="remote-field ui-input" maxlength="64" placeholder="Mot de passe" autocomplete="current-password" aria-describedby="remote-status">
                <button id="remote-auth" class="remote-btn ui-btn">Authentifier</button>
            </div>
            <p id="remote-status" class="remote-status" role="status" aria-live="polite">Entrez l’ID de salle et le mot de passe.</p>
            <p id="remote-session" class="remote-subline" aria-live="polite"></p>
        </section>

        <section class="remote-card" aria-labelledby="remote-ctrl-title">
            <h2 class="remote-title" id="remote-ctrl-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="11" width="3" height="7"/><rect x="11" y="8" width="3" height="10"/><rect x="16" y="5" width="3" height="13"/></svg>
                Contrôles
            </h2>
            <div class="remote-grid" role="group" aria-label="Navigation et minuteur">
                <button class="remote-btn ui-btn" data-cmd="prev">Précédent</button>
                <button class="remote-btn ui-btn" data-cmd="next">Suivant</button>
                <button class="remote-btn ui-btn" data-cmd="black">Noir</button>
                <button class="remote-btn ui-btn" data-cmd="salle">Onglet Salle</button>
                <button class="remote-btn ui-btn" data-cmd="timer-toggle">Timer start/stop</button>
                <button class="remote-btn ui-btn" data-cmd="timer-reset">Timer reset</button>
            </div>
            <div class="remote-row remote-row-goto">
                <label class="ui-sr-only" for="remote-goto-index">Aller à la slide numéro</label>
                <input id="remote-goto-index" class="remote-field ui-input" type="number" min="1" step="1" placeholder="Aller à la slide #">
                <button id="remote-goto-btn" class="remote-btn ui-btn">Aller</button>
            </div>
        </section>
    </main>

    <script src="../shared/slides/realtime-contract.js?v=6"></script>
    <script src="../shared/slides/network-session.js?v=2"></script>
    <script src="../vendor/peerjs/1.5.5/peerjs.min.js"></script>
    <script src="remote-main.js?v=1"></script>
</body>
</html>
